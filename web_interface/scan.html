<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Deauther Nano — Scan">
  <title>Scan — Deauther Nano</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/site.js"></script>
  <script src="js/scan.js"></script>
</head>
<body onload="loadLang()">
  <nav>
    <ul class="menu">
      <li><a href="scan.html"     data-translate="scan">Scan</a></li>
      <li><a href="ssids.html"    data-translate="ssids">SSIDs</a></li>
      <li><a href="attack.html"   data-translate="attacks">Attack</a></li>
      <li><a href="settings.html" data-translate="settings">Settings</a></li>
      <li><span id="deviceStatus"><span class="ds-dot"></span><span id="dsText">--</span></span></li>
    </ul>
  </nav>

  <div id="status" class="status-ok"><span class="status-dot dot-ok"></span>Connected</div>

  <div class="container">
    <div class="row">
      <div class="col-12">
        <h1 data-translate="scan">Scan</h1>

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
          <button id="scanZero" onclick="scan(0)" data-translate="scan_aps">Scan APs</button>
          <button id="scanOne"  onclick="scan(1)" data-translate="scan_stations">Scan Stations</button>
          <button id="RButton"  onclick="load()" data-translate="reload" class="right">Reload</button>
        </div>

        <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:6px;">
          <label for="ch" data-translate="channel">Channel:</label>
          <select id="ch" name="ch">
            <option value="all" data-translate="all">All</option>
            <option value="1">1</option>  <option value="2">2</option>
            <option value="3">3</option>  <option value="4">4</option>
            <option value="5">5</option>  <option value="6">6</option>
            <option value="7">7</option>  <option value="8">8</option>
            <option value="9">9</option>  <option value="10">10</option>
            <option value="11">11</option><option value="12">12</option>
            <option value="13">13</option><option value="14">14</option>
          </select>
          <label for="scanTime" data-translate="station_scan_time">Station scan time:</label>
          <input type="number" value="15" id="scanTime" style="width:4em;"> s
        </div>

        <div id="scanProgress"><div class="spinner"></div><span id="scanProgressText">Scanning…</span></div>

        <p class="muted" style="font-size:12px; margin:8px 0 4px;">
          <span class="red" data-translate="info_span">INFO: </span>
          <span data-translate="scan_info">Scan APs first, then reload. Station scans temporarily drop the web interface.</span>
        </p>
        <hr>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <h2>Access Points <span id="apNum" style="font-weight:normal; color:var(--muted);"></span></h2>
        <div style="overflow-x:auto;">
          <table id="apTable"></table>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1rem;">
          <button onclick="selectAll(0,true)"  data-translate="select_all">Select All</button>
          <button onclick="selectAll(0,false)" data-translate="deselect_all">Deselect All</button>
        </div>

        <h2>Stations <span id="stNum" style="font-weight:normal; color:var(--muted);"></span></h2>
        <div style="overflow-x:auto;">
          <table id="stTable"></table>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1rem;">
          <button onclick="selectAll(1,true)"  data-translate="select_all">Select All</button>
          <button onclick="selectAll(1,false)" data-translate="deselect_all">Deselect All</button>
        </div>

        <h2 data-translate="devices">Saved Devices <span id="nNum" style="font-weight:normal; color:var(--muted);"></span></h2>
        <div style="overflow-x:auto;">
          <table id="nTable"></table>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1rem;">
          <button onclick="selectAll(2,true)"  data-translate="select_all">Select All</button>
          <button onclick="selectAll(2,false)" data-translate="deselect_all">Deselect All</button>
          <button onclick="add(2)"             data-translate="new">+ New</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <span id="version">Deauther Nano v2.6.1</span> &nbsp;·&nbsp;
    <a href="info.html">Credits</a>
  </footer>

  <script>
    // Mark active nav link
    document.querySelectorAll('.menu a').forEach(function(a) {
      if (a.href === location.href) a.classList.add('active');
    });
  </script>
</body>
</html>
