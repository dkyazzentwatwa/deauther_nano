<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Deauther Nano — Settings">
  <title>Settings — Deauther Nano</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/site.js"></script>
  <script src="js/settings.js"></script>
</head>
<body onload="loadLang()">
  <nav>
    <ul class="menu">
      <li><a href="scan.html"     data-translate="scan">Scan</a></li>
      <li><a href="ssids.html"    data-translate="ssids">SSIDs</a></li>
      <li><a href="attack.html"   data-translate="attacks">Attack</a></li>
      <li><a href="settings.html" data-translate="settings">Settings</a></li>
      <li><span id="deviceStatus"><span class="ds-dot"></span><span id="dsText">--</span></span></li>
    </ul>
  </nav>

  <div id="status" class="status-ok"><span class="status-dot dot-ok"></span>Connected</div>

  <div class="container">
    <div class="row">
      <div class="col-12">
        <h1 data-translate="settings">Settings</h1>

        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
          <button onclick="save()" data-translate="save" class="btn-accent">Save</button>
          <button onclick="load()" data-translate="reload">Reload</button>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px;">
          <button onclick="getFile('run?cmd=reset;;save settings')" class="btn-danger" data-translate="reset">Factory Reset</button>
          <button onclick="getFile('run?cmd=reboot')" class="btn-danger" data-translate="reboot">Reboot</button>
          <button onclick="if(confirm('Turn off WiFi? Reboot to reconnect.')) getFile('run?cmd=stopap');" class="btn-danger" data-translate="wifi_off">WiFi Off</button>
        </div>

        <p class="muted" style="font-size:12px; margin:10px 0 4px;" data-translate="settings_info">
          Some settings require a reboot. Click Save before rebooting.
        </p>
        <hr>
      </div>
    </div>

    <div id="settingsList"></div>
  </div>

  <footer>
    <span id="version">Deauther Nano v2.6.1</span> &nbsp;·&nbsp;
    <a href="info.html">Credits</a>
  </footer>

  <script>
    document.querySelectorAll('.menu a').forEach(function(a) {
      if (a.href === location.href) a.classList.add('active');
    });
  </script>
</body>
</html>
